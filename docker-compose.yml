version: "3.8"

services:
  # ── LINE 智能客服 (Portal frontend + CS backend) ────────────────
  app:
    image: ghcr.io/schsu-leo/shang-ren-automation/app:latest
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-line_cs}
    volumes:
      - uploads:/app/server/uploads
      - ${GOOGLE_SA_KEY_PATH:-./credentials/google-sa.json}:/app/credentials/google-sa.json:ro
      - ${DRIVE_TOKEN_PATH:-./credentials/drive_token.json}:/app/credentials/drive_token.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # ── Auth routes (不改寫) ──
      - traefik.http.routers.portal-auth.rule=Host(`app.shang-ren.com`) && PathPrefix(`/api/auth`)
      - traefik.http.routers.portal-auth.entrypoints=https
      - traefik.http.routers.portal-auth.tls=true
      - traefik.http.routers.portal-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-auth.service=portal-svc
      - traefik.http.routers.portal-auth.priority=30

      # ── LINE Webhook (不改寫) ──
      - traefik.http.routers.portal-webhook.rule=Host(`app.shang-ren.com`) && PathPrefix(`/api/webhook`)
      - traefik.http.routers.portal-webhook.entrypoints=https
      - traefik.http.routers.portal-webhook.tls=true
      - traefik.http.routers.portal-webhook.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-webhook.service=portal-svc
      - traefik.http.routers.portal-webhook.priority=30

      # ── Setup route (不改寫) ──
      - traefik.http.routers.portal-setup.rule=Host(`app.shang-ren.com`) && PathPrefix(`/api/setup`)
      - traefik.http.routers.portal-setup.entrypoints=https
      - traefik.http.routers.portal-setup.tls=true
      - traefik.http.routers.portal-setup.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-setup.service=portal-svc
      - traefik.http.routers.portal-setup.priority=30

      # ── CS API (/api/cs/* → /api/*) ──
      - traefik.http.routers.portal-cs.rule=Host(`app.shang-ren.com`) && PathPrefix(`/api/cs`)
      - traefik.http.routers.portal-cs.entrypoints=https
      - traefik.http.routers.portal-cs.tls=true
      - traefik.http.routers.portal-cs.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-cs.service=portal-svc
      - traefik.http.routers.portal-cs.priority=20
      - traefik.http.routers.portal-cs.middlewares=cs-strip
      - traefik.http.middlewares.cs-strip.replacepathregex.regex=^/api/cs/(.*)
      - traefik.http.middlewares.cs-strip.replacepathregex.replacement=/api/$$1

      # ── Frontend SPA catch-all ──
      - traefik.http.routers.portal-frontend.rule=Host(`app.shang-ren.com`)
      - traefik.http.routers.portal-frontend.entrypoints=https
      - traefik.http.routers.portal-frontend.tls=true
      - traefik.http.routers.portal-frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-frontend.service=portal-svc
      - traefik.http.routers.portal-frontend.priority=1

      # ── Service definition ──
      - traefik.http.services.portal-svc.loadbalancer.server.port=3000

      # ── 向後相容 admin.shang-ren.com ──
      - traefik.http.routers.portal-legacy.rule=Host(`admin.shang-ren.com`)
      - traefik.http.routers.portal-legacy.entrypoints=https
      - traefik.http.routers.portal-legacy.tls=true
      - traefik.http.routers.portal-legacy.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-legacy.middlewares=legacy-redirect
      - traefik.http.middlewares.legacy-redirect.redirectregex.regex=^https://admin\.shang-ren\.com/(.*)
      - traefik.http.middlewares.legacy-redirect.redirectregex.replacement=https://app.shang-ren.com/$${1}
      - traefik.http.middlewares.legacy-redirect.redirectregex.permanent=true

  # ── 月結請款 (FastAPI + Playwright) ─────────────────────────────
  invoice:
    build:
      context: ../gas-monthly-invoice
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../gas-monthly-invoice/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET:-changeme-portal}
      - BASE_PATH=/api/inv
      - LINE_BRIDGE_URL=http://host.docker.internal:9223
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - invoice-output:/app/output
      - ${DRIVE_TOKEN_PATH:-./credentials/drive_token.json}:/app/drive_token.json
      - ${GOOGLE_SA_KEY_PATH:-./credentials/google-sa.json}:/app/credentials/google-sa.json:ro
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # ── Invoice API (/api/inv/* → /*) ──
      - traefik.http.routers.portal-inv.rule=Host(`app.shang-ren.com`) && PathPrefix(`/api/inv`)
      - traefik.http.routers.portal-inv.entrypoints=https
      - traefik.http.routers.portal-inv.tls=true
      - traefik.http.routers.portal-inv.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-inv.service=invoice-svc
      - traefik.http.routers.portal-inv.priority=20
      - traefik.http.routers.portal-inv.middlewares=inv-strip
      - traefik.http.middlewares.inv-strip.replacepathregex.regex=^/api/inv/?(.*)
      - traefik.http.middlewares.inv-strip.replacepathregex.replacement=/$$1

      - traefik.http.services.invoice-svc.loadbalancer.server.port=8080

  # ── 出貨明細 PDF (Express + Playwright) ─────────────────────────
  delivery:
    build:
      context: ../delivery-pdf-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3002
      - GOOGLE_SA_KEY_PATH=/app/credentials/google-sa.json
      - DRIVE_TOKEN_PATH=/app/credentials/drive_token.json
    volumes:
      - ${GOOGLE_SA_KEY_PATH:-./credentials/google-sa.json}:/app/credentials/google-sa.json:ro
      - ${DRIVE_TOKEN_PATH:-./credentials/drive_token.json}:/app/credentials/drive_token.json:ro
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # ── Delivery PDF API (不改寫，路徑已完整對應) ──
      - traefik.http.routers.portal-delivery.rule=Host(`app.shang-ren.com`) && PathPrefix(`/api/delivery-pdf`)
      - traefik.http.routers.portal-delivery.entrypoints=https
      - traefik.http.routers.portal-delivery.tls=true
      - traefik.http.routers.portal-delivery.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-delivery.service=delivery-svc
      - traefik.http.routers.portal-delivery.priority=30

      - traefik.http.services.delivery-svc.loadbalancer.server.port=3002

  # ── 考勤系統 API (Express + Prisma) ─────────────────────────────
  attendance:
    image: ghcr.io/schsu-leo/shang-ren-automation/attendance:latest
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/line_cs
      - JWT_SECRET=${ATT_JWT_SECRET:-changeme-att}
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET:-changeme-portal}
      - LINE_LIFF_ID=2009561373-EUy47Hcq
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # ── Attendance API (/api/att/* → /api/*) ──
      - traefik.http.routers.portal-att.rule=Host(`app.shang-ren.com`) && PathPrefix(`/api/att`)
      - traefik.http.routers.portal-att.entrypoints=https
      - traefik.http.routers.portal-att.tls=true
      - traefik.http.routers.portal-att.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-att.service=attendance-svc
      - traefik.http.routers.portal-att.priority=20
      - traefik.http.routers.portal-att.middlewares=att-strip
      - traefik.http.middlewares.att-strip.replacepathregex.regex=^/api/att/?(.*)
      - traefik.http.middlewares.att-strip.replacepathregex.replacement=/api/$$1

      - traefik.http.services.attendance-svc.loadbalancer.server.port=3001

  # ── 考勤系統前端 (nginx 靜態) ───────────────────────────────────
  att-client:
    image: ghcr.io/schsu-leo/shang-ren-automation/att-client:latest
    restart: unless-stopped
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # ── Attendance Frontend (/attendance/*) ──
      - traefik.http.routers.portal-att-fe.rule=Host(`app.shang-ren.com`) && PathPrefix(`/attendance`)
      - traefik.http.routers.portal-att-fe.entrypoints=https
      - traefik.http.routers.portal-att-fe.tls=true
      - traefik.http.routers.portal-att-fe.tls.certresolver=letsencrypt
      - traefik.http.routers.portal-att-fe.service=att-client-svc
      - traefik.http.routers.portal-att-fe.priority=10

      - traefik.http.services.att-client-svc.loadbalancer.server.port=80

  # ── NocoDB (統一資料庫管理介面) ──────────────────────────────────
  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    # Patch request-filtering-agent to allow Docker internal network (SSRF bypass for self-hosted)
    entrypoint:
      - sh
      - -c
      - "sed -i 's/allowPrivateIPAddress: false/allowPrivateIPAddress: true/' /usr/src/app/node_modules/request-filtering-agent/lib/request-filtering-agent.js 2>/dev/null || true && exec /usr/bin/dumb-init -- /usr/src/appEntry/start.sh"
    environment:
      - NC_DB=pg://db:5432?u=${POSTGRES_USER:-postgres}&p=${POSTGRES_PASSWORD:-changeme}&d=${POSTGRES_DB:-line_cs}
      - NC_AUTH_JWT_SECRET=${NOCODB_JWT_SECRET:-changeme-nocodb}
    volumes:
      - nocodb-data:/usr/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify

      # ── NocoDB UI (db.shang-ren.com) ──
      - traefik.http.routers.nocodb.rule=Host(`db.shang-ren.com`)
      - traefik.http.routers.nocodb.entrypoints=https
      - traefik.http.routers.nocodb.tls=true
      - traefik.http.routers.nocodb.tls.certresolver=letsencrypt
      - traefik.http.routers.nocodb.service=nocodb-svc

      - traefik.http.services.nocodb-svc.loadbalancer.server.port=8080

  # ── PostgreSQL (line_cs + attendance) ───────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-line_cs}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  uploads:
  pgdata:
  invoice-output:
  nocodb-data:

networks:
  internal:
  coolify:
    external: true
